networking:
  port: 9461

runtime:
  num_threads: 8
  queue_depth: 8192
  first_busy_wait: 10000000

gpu:
  queue_depth: 8192

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "1GB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      # NOTE: capacity_limit on an hbm tier is a GPU allocation taken at
      # STARTUP, whatever the workload does, so it lands in peak VRAM before
      # a single page is faulted. 1024MB is generous here because this
      # example's atom arrays are meant to stay hot; do not copy the number
      # into a config whose point is to MEASURE what paging saves. In LBANN
      # this exact value made the paged path read as a 7x memory loss on a
      # small model, and hid an 11.7x saving on a large one. See
      # ../../../lbann/src/eternia/test/clio.yaml for a sizing rationale.
      - path: "hbm::lmp_hbm"
        bdev_type: "hbm"
        capacity_limit: "1024MB"
        score: 1.0
      - path: "ram::lmp_ram"
        bdev_type: "ram"
        capacity_limit: "4096MB"
        score: 0.2
    dpe:
      dpe_type: "max_bw"
