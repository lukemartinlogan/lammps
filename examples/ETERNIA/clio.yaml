networking:
  port: 9461

runtime:
  num_threads: 8
  queue_depth: 8192
  first_busy_wait: 10000000

gpu:
  queue_depth: 8192

compose:
  - mod_name: clio_bdev
    pool_name: "ram::chi_default_bdev"
    pool_query: local
    pool_id: "301.0"
    bdev_type: ram
    capacity: "1GB"

  - mod_name: clio_cte_core
    pool_name: cte_core
    pool_query: local
    pool_id: "512.0"
    storage:
      - path: "hbm::lmp_hbm"
        bdev_type: "hbm"
        capacity_limit: "1024MB"
        score: 1.0
      - path: "ram::lmp_ram"
        bdev_type: "ram"
        capacity_limit: "4096MB"
        score: 0.2
    dpe:
      dpe_type: "max_bw"
